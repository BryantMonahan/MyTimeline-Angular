<div class="p-6 min-w-80 max-w-sm bg-black rounded-xl">
    <div class="flex items-start gap-3">
        <div class=" p-2 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-error" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v2m0 4h.01M10.29 3.86l-8.18 14.14A1 1 0 003 19.5h18a1 1 0 00.89-1.5L13.71 3.86a1 1 0 00-1.72 0z" />
            </svg>
        </div>
        <div>
            <h3 class="font-semibold text-base-content">Confirm action</h3>
            <p class="text-sm text-base-content/70 mt-1">{{ data.message }}</p>
        </div>
    </div>

    <div class="flex justify-end gap-2 mt-6">
        <button type="button" class="btn btn-ghost  border-white btn-sm" (click)="cancel()">Cancel</button>
        <button type="button" class="btn btn-error btn-sm" (click)="confirm()">Confirm</button>
    </div>
</div>
