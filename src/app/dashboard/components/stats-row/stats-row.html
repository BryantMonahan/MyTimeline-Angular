<div class="stats stats-vertical sm:stats-horizontal shadow w-full bg-base-100 border border-base-300">
  <div class="stat">
    <div class="stat-figure text-primary">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19 11a7 7 0 01-14 0m7 7v4m-4 0h8M12 1a3 3 0 00-3 3v7a3 3 0 006 0V4a3 3 0 00-3-3z" />
      </svg>
    </div>
    <div class="stat-title">Total entries</div>
    <div class="stat-value text-primary">{{totalEntries()}}</div>
    <!-- <div class="stat-desc">↗ 12 new this month</div> -->
  </div>

  <div class="stat">
    <div class="stat-figure text-secondary">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <div class="stat-title">Recorded time</div>
    <div class="stat-value text-secondary">{{ (secondTotal() * 1000) | date:'HH:mm:ss':'UTC' }}</div>
    <div class="stat-desc">Across all journals</div>
  </div>

  <div class="stat">
    <div class="stat-figure text-success">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <div class="stat-title">Words Transcribed</div>
    <div class="stat-value text-success">{{ wordsTotal() }}</div>
    <div class="stat-desc">{{ percentTranscribed() }} transcribed</div>
  </div>

  <div class="stat">
    <div class="stat-figure text-warning">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 8v4l2.5 2.5M12 4a8 8 0 100 16 8 8 0 000-16zm0 0V2m-2 0h4M18 6l1.5-1.5" />
      </svg>
    </div>
    <div class="stat-title">Longest entry</div>
    <div class="stat-value text-warning">{{ (longestEntrySeconds() * 1000) | date:'HH:mm:ss':'UTC' }}</div>
    <!-- <div class="stat-desc">Keep it going!</div> -->
  </div>
</div>
